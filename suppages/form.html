<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>WB2 REDRUM | Formulario</title>
        <link rel="stylesheet" href="../style.css">
        <script src="form.js" defer></script>
    </head>
    <body>

        <header>
            <a href="#" class="logo">
                <img src="../images/logo.png" style="width: auto; height: auto;">
                REDRUM
            </a>

            <div class="nav-actions">
                <nav style="display: flex; gap: 15px; color: white; font-weight: bold; font-size: 0.8rem;">
                    <a href="../index.html" style="text-decoration: none; color: white"><span style="cursor:pointer">Inicio</span></a>
                </nav>
            </div>
        </header>

        <main>
            <section id="banner" class="banner">
                <h1>Formulario de Registro</h1>
            </section>

            <section id="info" class="info-section">
                <div class="info-card" style=" align-items: center; text-align: center; position: relative; left: 50%; transform: translateX(-50%);">
                    <form id="Registro">
                        <div class="section-grid">
                            <label for="nombre">Nombre:</label>
                            <input class="InputText" placeholder="Ingrese su nombre" type="text" id="nombre" name="nombre" required>
                        </div>
                        <br>
                        <div class="section-grid">
                            <label for="edad">Edad:</label>
                            <input class="InputText" placeholder="Ingrese su edad" type="number" id="edad" name="edad" required>
                        </div>
                        <br>
                        <div class="section-grid">
                            <label for="email">Email:</label>
                            <input class="InputText" placeholder="Ingrese su email" type="email" id="email" name="email" required>
                        </div>
                        <br>
                        <div class="section-grid">
                            <label for="password">Contraseña:</label>
                            <input class="InputText" placeholder="Ingrese su contraseña" type="password" id="password" name="password" required>
                        </div>
                        <br>
                        <button id="BotonUnirse" type="submit">Registrarse</button>
                    </form>
                </div>
            </section>
        </main>

        <footer>
            <div id="contactos" class="footer-grid">
                <div class="footer-col">
                    <h4 style="color: var(--naranja-brave);">WB2 REDRUM</h4>
                    <p style="font-size: 0.9rem;">Volvamos a lo clasico sin dejar lo nuevo de lado.</p>
                </div>
                <div class="footer-col">
                    <h4>Contacto</h4>
                    <a id="ContactLinks" href="#" style="margin-bottom: 10px;">soporte@redrumWB2.com</a>
                    <a id="ContactLinks" href="#">Discord Oficial</a>
                </div>
                <div class="footer-col">
                    <h4>Legal</h4>
                    <p style="font-size: 0.8rem; color: #777;">Términos de Servicio y Privacidad.</p>
                </div>
            </div>
            <div id="CopyrightFooter">
                &copy; 2026 WB2 REDRUM. para lo que buscamos algo mas clasico.
            </div>
        </footer>
    </body>
</html>
